<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Student Registration Form</h1></center>
    <hr>
    <form action="submit.html">
        <label for="name">Full Name:</label>
        <input type="text" name="name" placeholder="Enter your full name" minlength="5" maxlength="15"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter valid email address"><br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" placeholder="Enter password"><br><br>

          
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Other</label><br><br>

            <label for="course">Course:</label>
        <select name="course" id="course">
                <option value="">Select Course</option>
                <option value="btech">Bachelor of Technology</option>
                <option value="bba">Bachelor of Business Administration</option>
                <option value="bcom">Bachelor of Commerce</option>
                <option value="mba">Master of Business Administration</option>
            </select><br><br>

            <label for="phone">Contact No:</label>
            <input type="tel" name="phone" placeholder="Enter phone number"><br><br>

               <label for="Address">Address:</label><br>
            <textarea name="address" id="address" placeholder="Enter your address"></textarea><br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">
    </form>
    <hr>
     <center><p> &copy; 2025 Student Registration Portal</p></center>
</body>
</html>
